name: Build Basic Rclone Flow

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: '~1.27.0'
          cache: false

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK / NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Build rclone v1.75.1 for arm64-v8a
        env:
          RCLONE_VERSION: v1.75.1
          NDK_VERSION: 27.2.12479018
        run: ./scripts/build-rclone.sh

      - name: Keep a stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rclonecards-debug-keystore-v1

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure cached signing key is used
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "RCLONE_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Test configuration response handling
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Test real rclone configuration protocol
        run: |
          curl --fail --location https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip -o /tmp/rclone-test.zip
          unzip -q /tmp/rclone-test.zip -d /tmp/rclone-test
          python3 scripts/test-drive-protocol.py /tmp/rclone-test/rclone-v1.75.1-linux-amd64/rclone

      - name: Build minified APK
        run: gradle --no-daemon :app:assembleRelease :app:assembleDriveTest

      - name: Verify APK output
        run: test -s app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Basic-Rclone-Flow-v2.1.1-arm64
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload isolated Drive test APK
        uses: actions/upload-artifact@v4
        with:
          name: Basic-Rclone-Flow-v2.1.1-Drive-Test-arm64
          path: app/build/outputs/apk/driveTest/app-driveTest.apk
          if-no-files-found: error
