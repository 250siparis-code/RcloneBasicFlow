name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: '~1.27.0'
          cache: false

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK / NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Build rclone v1.75.1 for arm64-v8a
        env:
          RCLONE_VERSION: v1.75.1
          NDK_VERSION: 27.2.12479018
        run: ./scripts/build-rclone.sh

      - name: Keep a stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rclonecards-debug-keystore-v1

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build minified APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RcloneCards-arm64-minified
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
